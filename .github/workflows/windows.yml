name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm audit
      - run: npm run licenses
      - run: npm run tauri build -- --bundles nsis
      - name: Verify per-user install with spaces in the path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $installDirectory = Join-Path $env:RUNNER_TEMP 'Markraft QA'
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDirectory" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          ./scripts/verify-windows-install.ps1 -InstallDirectory $installDirectory
      - name: Record installer SHA-256
        shell: pwsh
        run: Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | Format-List | Out-File src-tauri/target/release/bundle/nsis/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Markraft-windows-x64
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
