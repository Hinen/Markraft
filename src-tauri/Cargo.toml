[package]
name = "markraft"
version = "0.0.3"
description = "Text and Markdown editor"
authors = ["Markraft contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "markraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
open = "5"
url = "2"
